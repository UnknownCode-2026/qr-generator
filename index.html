<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Issue Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>
<style>
  :root{
    --paper:#EDEAE2;
    --paper-2:#E3DFD3;
    --ink:#1C1B19;
    --ink-soft:#57534A;
    --stamp:#B23A2E;
    --teal:#3B6E64;
    --line:#C9C3B4;
    --white:#FBFAF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.04) 1px, transparent 0) 0 0/16px 16px,
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .desk{
    width:100%;
    max-width:820px;
  }
  .desk-label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
    padding:0 4px;
  }
  .desk-label b{ color:var(--ink); font-weight:600; }

  .ticket{
    position:relative;
    background:var(--white);
    border:1px solid var(--ink);
    box-shadow: 0 1px 0 var(--ink), 0 14px 30px -18px rgba(0,0,0,0.35);
    display:grid;
    grid-template-columns: 1.15fr 0.85fr;
  }
  @media (max-width: 620px){
    .ticket{ grid-template-columns: 1fr; }
  }

  .stub-main{
    padding:34px 32px 30px;
    position:relative;
  }
  .stub-side{
    padding:30px 28px 26px;
    background:
      repeating-linear-gradient(135deg, transparent 0 8px, rgba(0,0,0,0.025) 8px 9px),
      var(--paper-2);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    position:relative;
  }

  /* perforation between the two stubs */
  .perf{
    position:absolute;
    top:0; bottom:0;
    left:0;
    width:0;
    border-left:2px dashed var(--line);
  }
  .perf-dot{
    position:absolute; left:-8px; width:16px; height:16px;
    border-radius:50%; background:var(--paper);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  @media (max-width: 620px){
    .perf{ display:none; }
  }

  .brand{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.02em;
  }
  .brand span{ color:var(--stamp); }
  .tagline{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
    margin-bottom:26px;
  }

  label.field-label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .input-row{
    display:flex;
    border:1px solid var(--ink);
    background:var(--white);
  }
  .input-row span{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    color:var(--ink-soft);
    padding:12px 0 12px 14px;
  }
  input#link-input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    padding:12px 14px 12px 4px;
    color:var(--ink);
    min-width:0;
  }
  input#link-input::placeholder{ color:#B7B2A4; }

  .row-2{
    display:flex;
    gap:20px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .field{ flex:1; min-width:130px; }
  select{
    width:100%;
    border:1px solid var(--ink);
    background:var(--white);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:10px 10px;
    color:var(--ink);
    appearance:none;
    -webkit-appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
  }

  .swatches{ display:flex; gap:8px; margin-top:8px; }
  .swatch{
    width:26px; height:26px; border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .swatch.active{ border-color:var(--ink); }

  .hint{
    margin-top:18px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.5;
    min-height:18px;
  }
  .hint.error{ color:var(--stamp); }

  /* right stub */
  .ticket-no{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    align-self:flex-start;
    margin-bottom:16px;
  }
  .qr-frame{
    background:var(--white);
    border:1px solid var(--ink);
    padding:14px;
    position:relative;
  }
  #qr-canvas{ display:block; image-rendering:pixelate; }
  .qr-placeholder{
    width:180px; height:180px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:#B7B2A4;
    text-align:center;
    line-height:1.6;
    padding:20px;
  }

  .stamp{
    position:absolute;
    top:22px; right:18px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--teal);
    border:2px solid var(--teal);
    border-radius:50%;
    width:64px; height:64px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    transform:rotate(-12deg);
    opacity:0;
    transition:opacity 0.25s ease;
    pointer-events:none;
  }
  .stamp.show{ opacity:0.85; }

  .issued{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:16px;
    text-align:center;
  }

  .actions{
    display:flex;
    gap:10px;
    margin-top:20px;
    width:100%;
  }
  button{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:11px 10px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--white);
    cursor:pointer;
    transition:transform 0.08s ease, background 0.15s ease;
  }
  button.secondary{
    background:transparent;
    color:var(--ink);
  }
  button:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  button:not(:disabled):active{ transform:translateY(1px); }
  button:not(:disabled):hover{ background:var(--stamp); border-color:var(--stamp); }
  button.secondary:not(:disabled):hover{ background:var(--paper-2); color:var(--ink); }

  .foot-note{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:16px;
    letter-spacing:0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="desk">
  <div class="desk-label"><span>เคาน์เตอร์ออกบัตร QR</span><b>ไม่ต้องล็อกอิน</b></div>

  <div class="ticket">
    <div class="perf">
      <div class="perf-dot" style="top:-8px;"></div>
      <div class="perf-dot" style="bottom:-8px;"></div>
    </div>

    <div class="stub-main">
      <div class="brand">QR<span>/</span>DESK</div>
      <div class="tagline">วางลิงก์ กดสร้าง ได้ QR ทันที — ไม่เก็บข้อมูลของคุณไว้ที่ไหน</div>

      <label class="field-label" for="link-input">ลิงก์ปลายทาง</label>
      <div class="input-row">
        <span>↗</span>
        <input id="link-input" type="text" placeholder="example.com หรือ https://..." autocomplete="off" spellcheck="false">
      </div>
      <div class="hint" id="hint">พิมพ์ลิงก์ด้านบน แล้วโค้ดจะปรากฏทางขวา</div>

      <div class="row-2">
        <div class="field">
          <label class="field-label">ขนาด</label>
          <select id="size-select">
            <option value="160">เล็ก · 160px</option>
            <option value="220" selected>กลาง · 220px</option>
            <option value="300">ใหญ่ · 300px</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">ความทนทานของโค้ด</label>
          <select id="ecl-select">
            <option value="L">ต่ำ · ไฟล์เบา</option>
            <option value="M" selected>ปานกลาง</option>
            <option value="Q">สูง</option>
            <option value="H">สูงสุด · ใส่โลโก้ได้</option>
          </select>
        </div>
      </div>

      <div class="field" style="margin-top:18px;">
        <label class="field-label">สีหมึก</label>
        <div class="swatches" id="swatches">
          <div class="swatch active" data-color="#1C1B19" style="background:#1C1B19;"></div>
          <div class="swatch" data-color="#B23A2E" style="background:#B23A2E;"></div>
          <div class="swatch" data-color="#3B6E64" style="background:#3B6E64;"></div>
          <div class="swatch" data-color="#2A4D8F" style="background:#2A4D8F;"></div>
        </div>
      </div>
    </div>

    <div class="stub-side">
      <div class="ticket-no" id="ticket-no">NO. 000000</div>
      <div class="qr-frame" id="qr-frame">
        <div class="qr-placeholder" id="qr-placeholder">ยังไม่มีโค้ด<br>รอลิงก์จากทางซ้าย</div>
        <canvas id="qr-canvas" style="display:none;"></canvas>
        <div class="stamp" id="stamp">พร้อม<br>ใช้งาน</div>
      </div>
      <div class="issued" id="issued"></div>

      <div class="actions">
        <button id="btn-png" class="secondary" disabled>ดาวน์โหลด PNG</button>
        <button id="btn-svg" disabled>ดาวน์โหลด SVG</button>
      </div>
    </div>
  </div>

  <div class="foot-note">ประมวลผลทั้งหมดในเบราว์เซอร์ของคุณ · ไม่มีการส่งลิงก์ไปเซิร์ฟเวอร์ใด ๆ</div>
</div>

<script>
  const input = document.getElementById('link-input');
  const hint = document.getElementById('hint');
  const canvas = document.getElementById('qr-canvas');
  const placeholder = document.getElementById('qr-placeholder');
  const stamp = document.getElementById('stamp');
  const sizeSelect = document.getElementById('size-select');
  const eclSelect = document.getElementById('ecl-select');
  const swatches = document.querySelectorAll('.swatch');
  const btnPng = document.getElementById('btn-png');
  const btnSvg = document.getElementById('btn-svg');
  const ticketNo = document.getElementById('ticket-no');
  const issued = document.getElementById('issued');

  let currentColor = '#1C1B19';
  let currentSvg = '';
  let debounceTimer = null;

  ticketNo.textContent = 'NO. ' + String(Math.floor(Math.random()*900000)+100000);
  issued.textContent = 'ออกบัตรเมื่อ ' + new Date().toLocaleString('th-TH', { dateStyle:'medium', timeStyle:'short' });

  swatches.forEach(sw => {
    sw.addEventListener('click', () => {
      swatches.forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      currentColor = sw.dataset.color;
      render();
    });
  });

  sizeSelect.addEventListener('change', render);
  eclSelect.addEventListener('change', render);
  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 220);
  });

  function normalizeUrl(raw){
    const v = raw.trim();
    if(!v) return '';
    if(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(v)) return v;
    if(/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v)) return v; // mailto:, tel:, etc.
    return 'https://' + v;
  }

  function render(){
    const raw = input.value;
    const value = normalizeUrl(raw);

    if(!value){
      showEmpty();
      return;
    }

    const size = parseInt(sizeSelect.value, 10);
    const ecl = eclSelect.value;

    QRCode.toCanvas(canvas, value, {
      width: size,
      margin: 1,
      errorCorrectionLevel: ecl,
      color: { dark: currentColor, light: '#FBFAF7' }
    }, function(err){
      if(err){
        showError();
        return;
      }
      canvas.style.display = 'block';
      placeholder.style.display = 'none';
      stamp.classList.add('show');
      hint.classList.remove('error');
      hint.textContent = 'ชี้กล้องมือถือไปที่โค้ดเพื่อทดสอบ · ' + value;
      btnPng.disabled = false;
      btnSvg.disabled = false;
    });

    QRCode.toString(value, {
      type: 'svg',
      margin: 1,
      errorCorrectionLevel: ecl,
      color: { dark: currentColor, light: '#FBFAF7' }
    }, function(err, svg){
      if(!err) currentSvg = svg;
    });
  }

  function showEmpty(){
    canvas.style.display = 'none';
    placeholder.style.display = 'flex';
    placeholder.textContent = '';
    placeholder.innerHTML = 'ยังไม่มีโค้ด<br>รอลิงก์จากทางซ้าย';
    stamp.classList.remove('show');
    hint.classList.remove('error');
    hint.textContent = 'พิมพ์ลิงก์ด้านบน แล้วโค้ดจะปรากฏทางขวา';
    btnPng.disabled = true;
    btnSvg.disabled = true;
  }

  function showError(){
    canvas.style.display = 'none';
    placeholder.style.display = 'flex';
    placeholder.innerHTML = 'สร้างโค้ดไม่สำเร็จ<br>ลองย่อข้อความให้สั้นลง';
    stamp.classList.remove('show');
    hint.classList.add('error');
    hint.textContent = 'ลิงก์นี้ยาวหรือซับซ้อนเกินไปสำหรับระดับความทนทานที่เลือก';
    btnPng.disabled = true;
    btnSvg.disabled = true;
  }

  btnPng.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'qr-code.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  btnSvg.addEventListener('click', () => {
    if(!currentSvg) return;
    const blob = new Blob([currentSvg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = 'qr-code.svg';
    link.href = url;
    link.click();
    URL.revokeObjectURL(url);
  });

  showEmpty();
</script>

</body>
  </html>
